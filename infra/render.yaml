services:
  - type: web
    name: captura-camera-api
    runtime: python
    plan: starter
    region: oregon
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: >
      bash -lc 'mkdir -p /var/data/uploads &&
      ln -sfn /var/data/uploads /opt/render/project/src/uploads &&
      uvicorn backend.main:app --host 0.0.0.0 --port $PORT'
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
    disk:
      name: uploads-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: captura-camera-frontend
    rootDir: .
    buildCommand: >
      bash -lc 'mkdir -p dist &&
      cp -R frontend/* dist/ &&
      sed -i "s|^const API_BASE_URL = .*|const API_BASE_URL = \"${FRONTEND_API_BASE_URL}\";|" dist/app.js'
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: FRONTEND_API_BASE_URL
        value: https://captura-camera-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
