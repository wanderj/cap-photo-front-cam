services:
  - type: web
    name: captura-camera-api
    env: python
    region: oregon
    plan: starter
    rootDir: .
    buildCommand: pip install -r [requirements.txt](http://_vscodecontentref_/0)
    startCommand: >
      bash -lc 'mkdir -p /var/data/uploads &&
      ln -sfn /var/data/uploads /opt/render/project/src/uploads &&
      uvicorn backend.main:app --host 0.0.0.0 --port $PORT'
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
    disk:
      name: uploads-data
      mountPath: /var/data
      sizeGB: 1

  - type: web
    name: captura-camera-frontend
    env: static
    rootDir: .
    buildCommand: >
      bash -lc 'mkdir -p dist &&
      cp -R frontend/* dist/ &&
      sed -i "s|^const API_BASE_URL = .*|const API_BASE_URL = \"https://captura-camera-api.onrender.com\";|" dist/app.js'
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
